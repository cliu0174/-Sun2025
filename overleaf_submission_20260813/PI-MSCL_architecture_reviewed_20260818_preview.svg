  <rect x="970" y="620" width="175" height="75" rx="8" fill="#f8e9e9" stroke="#b55458" class="box"/><text x="1057" y="650" text-anchor="middle" class="label">Soft monotonicity</text><text x="1057" y="675" text-anchor="middle" class="label">Lₘₒₙₒ</text>
