  <g text-anchor="middle"><text x="365" y="145" class="small">Conv1D (64, k=3)</text><text x="365" y="160" class="tiny">BN + ReLU + MaxPool (2)</text><text x="540" y="145" class="small">Conv1D (64, k=3)</text><text x="540" y="160" class="tiny">BN + ReLU + MaxPool (2)</text><text x="365" y="240" class="small">Conv1D (64, k=7)</text><text x="365" y="255" class="tiny">BN + ReLU + MaxPool (2)</text><text x="540" y="240" class="small">Conv1D (64, k=7)</text><text x="540" y="255" class="tiny">BN + ReLU + MaxPool (2)</text><text x="365" y="335" class="small">Conv1D (64, k=15)</text><text x="365" y="350" class="tiny">BN + ReLU + MaxPool (2)</text><text x="540" y="335" class="small">Conv1D (64, k=15)</text><text x="540" y="350" class="tiny">BN + ReLU + MaxPool (2)</text></g>
  <g text-anchor="middle" class="tiny"><text x="453" y="188" fill="#2f6f8f">40×14 → 20×64 → 10×64</text><text x="453" y="283" fill="#347e65">40×14 → 20×64 → 10×64</text><text x="453" y="378" fill="#78609a">40×14 → 20×64 → 10×64</text></g>
