  <rect x="1320" y="575" width="340" height="125" rx="8" fill="#f2d7d7" stroke="#a5484d" stroke-width="1.4"/><text x="1490" y="610" text-anchor="middle" class="label">Training objective</text><text x="1490" y="645" text-anchor="middle" class="section">L = Lₛᵤₚ + λₘₒₙₒLₘₒₙₒ + λᵣₐₜₑLᵣₐₜₑ</text>
