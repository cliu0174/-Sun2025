  <text x="285" y="113" class="label" fill="#2f6f8f">Short scale (k = 3)</text>
  <text x="285" y="208" class="label" fill="#347e65">Intermediate scale (k = 7)</text>
  <text x="285" y="303" class="label" fill="#78609a">Broad scale (k = 15)</text>
