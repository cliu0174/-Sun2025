  <rect x="20" y="20" width="1720" height="375" rx="8" class="panel"/><text x="38" y="48" class="title">(a) PI-MSCL architecture</text>
  <rect x="20" y="415" width="1720" height="365" rx="8" class="panel"/><text x="38" y="443" class="title">(b) Sparse-label physics-informed learning</text>
  <rect x="62" y="150" width="188" height="104" rx="8" fill="#f7fafc" stroke="#8697a8" class="box"/>
  <text x="156" y="178" text-anchor="middle" class="label">Charging-feature sequence</text><text x="156" y="201" text-anchor="middle" class="small">Xᵢ,ₜ ∈ R⁴⁰×¹⁴</text><text x="156" y="221" text-anchor="middle" class="small">40 cycles × 14 features</text>
