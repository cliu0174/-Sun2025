  <rect x="1480" y="178" width="180" height="112" rx="12" fill="#f4f5f7" stroke="#555e68" class="box"/><text x="1570" y="212" text-anchor="middle" class="label">ŷᵢ,ₜ</text><text x="1570" y="237" text-anchor="middle" class="small">Predicted SOH</text><text x="1570" y="258" text-anchor="middle" class="small">ŷᵢ,ₜ ∈ (0, 1)</text>
